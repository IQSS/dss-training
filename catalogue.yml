# The honeycomb: rows of seven, staggered. A slot is an item id, a group id, or `hub`. Color follows the
# item's language; the hub is white.
comb:
  hub:
    hex: Workshops|for groups
    icon: presentation
    eyebrow: Returning in 2027
    title: Workshops for groups
    text: "Live workshops for departments, labs, and centers across Harvard and MIT return in 2027, on any of these topics or one of your own. Tell us what you would want: the topic, the language, the format."
    button: Tell us what you’d want
  groups: []
  rows:
    - [py-intro, py-scrape, selenium, stata-intro, stata-data, stata-graphics, stata-models]
    - [r-intro, r-wrangle, r-graphics, hub, r-models, matching, rbuild]
    - [ds-tools, vscode, emacs, git, gh-pages, latex, overleaf]

# The catalogue beneath the comb, in the order shown.
workshops:
  - { heading: Any language, lang: tools, items: [ds-tools] }
  - { heading: R, lang: r, items: [r-intro, r-wrangle, r-graphics, r-models] }
  - { heading: Python, lang: python, items: [py-intro, py-scrape] }
  - { heading: Stata, lang: stata, items: [stata-intro, stata-data, stata-graphics, stata-models] }
guides: [git, gh-pages, vscode, emacs, latex, overleaf, rbuild, matching, selenium]

