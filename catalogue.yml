# catalogue.yml — everything the training index shows, and how it is arranged. src/render.mjs turns this into
# the page's generated parts before every Quarto render. To add a material: add an item under `items`, then put
# its id in a `comb.rows` slot (or in a group's `items`) and in `workshops` or `guides`; the build fails loudly
# if an item is missing from either place.
#
# Item fields: id (short, stable); title; hex (the label on its hexagon, `|` breaks the line; two lines at most,
# three if short); icon (a Lucide icon name, lucide.dev/icons); lang (r · python · stata · tools); kind
# (workshop · guide); year (when the materials were last touched); blurb (one sentence); links (the first is the
# one the title links to).

languages:
  r:      { name: R,                 color: "#3C72B4" }
  python: { name: Python,            color: "#C4963C" }
  stata:  { name: Stata,             color: "#7A5C93" }
  tools:  { name: Tools and writing, color: "#2F8A8A" }

kinds:
  workshop: Workshop
  guide: Guide

urls:
  landing: https://www.iq.harvard.edu/data-science-services
  request: https://www.iq.harvard.edu/data-science-services/contact-us
  events: https://www.iq.harvard.edu/events

