project:
  type: website
  output-dir: _site
  render:
    - index.qmd
  pre-render: node src/render.mjs
  resources:
    - assets/

website:
  title: "DSS Training Materials"
  site-url: https://iqss.github.io/dss-training/
  repo-url: https://github.com/IQSS/dss-training
  description: "Materials from the IQSS Data Science Services workshops and beginner's guides: R, Python, Stata, and the tools around them."
  favicon: assets/favicon.png
  open-graph: true
  search: false
  navbar:
    title: false
    pinned: true
    logo:
      light: assets/dss-logo.svg
      dark: assets/dss-logo-dark.svg
    logo-alt: "Data Science Services"
    logo-href: https://www.iq.harvard.edu/data-science-services
    background: "#ffffff"
    right:
      - text: "Data Science Services"
        href: https://www.iq.harvard.edu/data-science-services
      - text: "Events"
        href: https://www.iq.harvard.edu/events
      - text: "Request help"
        href: https://www.iq.harvard.edu/data-science-services/contact-us
  page-footer:
    left: '<a href="https://www.iq.harvard.edu/" class="footer-logo-link"><img src="assets/iqss-logo.png" alt="IQSS, the Institute for Quantitative Social Science" class="footer-logo light-content"><img src="assets/iqss-logo-dark.png" alt="" class="footer-logo dark-content"></a><span>Data Science Services · Institute for Quantitative Social Science · Harvard University</span>'
    # The footer is provenance, not navigation: the navbar carries Data Science Services and Request help,
    # and the logo beside this text already links to IQSS. The licences are what nothing else here states.
    right:
      - text: "MIT"
        href: https://github.com/IQSS/dss-training/blob/main/LICENSE
      - text: "CC BY 4.0"
        href: https://github.com/IQSS/dss-training/blob/main/LICENSE-content

format:
  dss-theme-html:                 # the dss-theme extension: fonts and colours, light and dark, the Light/Dark/System menu
    theme:
      light: [cosmo, _extensions/IQSS/dss-theme/dss.scss, theme.scss]
      dark: [cosmo, _extensions/IQSS/dss-theme/dss.scss, _extensions/IQSS/dss-theme/dss-dark.scss, theme.scss, theme-dark.scss]
    page-layout: full
    toc: false
    anchor-sections: false
    grid:
      body-width: 1400px
      sidebar-width: 0px
      margin-width: 0px
    include-in-header:
      - text: |
          <meta name="theme-color" content="#3C72B4">
