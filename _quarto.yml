project:
  type: website
  output-dir: _site
  render:
    - index.qmd
  pre-render: node src/render.mjs
  resources:
    - assets/

website:
  title: "DSS Training Materials"
  site-url: https://iqss.github.io/dss-training/
  repo-url: https://github.com/IQSS/dss-training
  description: "Materials from the IQSS Data Science Services workshops and beginner's guides: R, Python, Stata, and the tools around them."
  favicon: assets/favicon.png
  open-graph: true
  search: false
  navbar:
    title: false
    pinned: true
    logo: assets/dss-logo.svg
    logo-alt: "Data Science Services"
    logo-href: https://www.iq.harvard.edu/data-science-services
    background: "#ffffff"
    right:
      - text: "Data Science Services"
        href: https://www.iq.harvard.edu/data-science-services
      - text: "Events"
        href: https://www.iq.harvard.edu/events
      - text: "Request help"
        href: https://www.iq.harvard.edu/data-science-services/contact-us
  page-footer:
    left: '<a href="https://www.iq.harvard.edu/" class="footer-logo-link"><img src="assets/iqss-logo.png" alt="IQSS, the Institute for Quantitative Social Science" class="footer-logo"></a><span>Data Science Services · Institute for Quantitative Social Science · Harvard University</span>'
    right:
      - text: "Data Science Services"
        href: https://www.iq.harvard.edu/data-science-services
      - text: "Request help"
        href: https://www.iq.harvard.edu/data-science-services/contact-us
      - text: "IQSS"
        href: https://www.iq.harvard.edu/

format:
  html:
    theme: theme.scss
    page-layout: full
    toc: false
    anchor-sections: false
    grid:
      body-width: 1400px
      sidebar-width: 0px
      margin-width: 0px
    include-in-header:
      - text: |
          <meta name="theme-color" content="#3C72B4">
